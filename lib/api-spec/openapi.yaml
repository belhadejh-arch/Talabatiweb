openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: TALABAT Multi-Restaurant SaaS Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: restaurants
  - name: subscriptions
  - name: categories
  - name: products
  - name: productSizes
  - name: addons
  - name: drivers
  - name: orders
  - name: analytics
  - name: notifications
  - name: settings
  - name: public

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Auth ────────────────────────────────────────────────────────────────────
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Admin logout
      responses:
        "200":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current admin
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          description: Not authenticated

  /auth/change-password:
    patch:
      operationId: changePassword
      tags: [auth]
      summary: Change admin password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeInput"
      responses:
        "200":
          description: Password changed

  /auth/change-email:
    patch:
      operationId: changeEmail
      tags: [auth]
      summary: Change admin email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailChangeInput"
      responses:
        "200":
          description: Email changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"

  # ── Restaurants ──────────────────────────────────────────────────────────────
  /restaurants:
    get:
      operationId: listRestaurants
      tags: [restaurants]
      summary: List all restaurants
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: number, default: 1 }
        - name: limit
          in: query
          schema: { type: number, default: 20 }
      responses:
        "200":
          description: List of restaurants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestaurantListResponse"

    post:
      operationId: createRestaurant
      tags: [restaurants]
      summary: Create a new restaurant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestaurantInput"
      responses:
        "201":
          description: Restaurant created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Restaurant"

  /restaurants/{id}:
    get:
      operationId: getRestaurant
      tags: [restaurants]
      summary: Get restaurant by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Restaurant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Restaurant"
        "404":
          description: Not found

    patch:
      operationId: updateRestaurant
      tags: [restaurants]
      summary: Update restaurant
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestaurantPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Restaurant"

    delete:
      operationId: deleteRestaurant
      tags: [restaurants]
      summary: Delete restaurant
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "204":
          description: Deleted

  /restaurants/{id}/status:
    patch:
      operationId: updateRestaurantStatus
      tags: [restaurants]
      summary: Activate or suspend restaurant
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Restaurant"

  # ── Subscriptions ───────────────────────────────────────────────────────────
  /restaurants/{id}/subscription:
    get:
      operationId: getSubscription
      tags: [subscriptions]
      summary: Get restaurant subscription
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"

    post:
      operationId: createSubscription
      tags: [subscriptions]
      summary: Create or renew subscription
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionInput"
      responses:
        "201":
          description: Subscription created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"

    patch:
      operationId: updateSubscription
      tags: [subscriptions]
      summary: Extend or change subscription
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"

  /subscriptions:
    get:
      operationId: listSubscriptions
      tags: [subscriptions]
      summary: List all subscriptions
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: number, default: 1 }
        - name: limit
          in: query
          schema: { type: number, default: 20 }
      responses:
        "200":
          description: Subscriptions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionListResponse"

  # ── Categories ───────────────────────────────────────────────────────────────
  /restaurants/{id}/categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List categories for a restaurant
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

    post:
      operationId: createCategory
      tags: [categories]
      summary: Create category
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

  /categories/{id}:
    patch:
      operationId: updateCategory
      tags: [categories]
      summary: Update category
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

    delete:
      operationId: deleteCategory
      tags: [categories]
      summary: Delete category
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "204":
          description: Deleted

  # ── Products ────────────────────────────────────────────────────────────────
  /restaurants/{id}/products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List products for a restaurant
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
        - name: categoryId
          in: query
          schema: { type: number }
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

    post:
      operationId: createProduct
      tags: [products]
      summary: Create product
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /products/{id}:
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update product
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete product
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "204":
          description: Deleted

  # ── Product Sizes ─────────────────────────────────────────────────────────────
  /products/{id}/sizes:
    get:
      operationId: listProductSizes
      tags: [productSizes]
      summary: List sizes for a product
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Sizes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductSize"

    post:
      operationId: createProductSize
      tags: [productSizes]
      summary: Create product size
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductSizeInput"
      responses:
        "201":
          description: Size created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductSize"

  /product-sizes/{id}:
    patch:
      operationId: updateProductSize
      tags: [productSizes]
      summary: Update product size
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductSizePatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductSize"

    delete:
      operationId: deleteProductSize
      tags: [productSizes]
      summary: Delete product size
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "204":
          description: Deleted

  # ── Addons ──────────────────────────────────────────────────────────────────
  /products/{id}/addons:
    get:
      operationId: listAddons
      tags: [addons]
      summary: List addons for a product
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Addons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Addon"

    post:
      operationId: createAddon
      tags: [addons]
      summary: Create addon
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddonInput"
      responses:
        "201":
          description: Addon created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Addon"

  /addons/{id}:
    patch:
      operationId: updateAddon
      tags: [addons]
      summary: Update addon
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddonPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Addon"

    delete:
      operationId: deleteAddon
      tags: [addons]
      summary: Delete addon
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "204":
          description: Deleted

  # ── Drivers ─────────────────────────────────────────────────────────────────
  /drivers:
    get:
      operationId: listAllDrivers
      tags: [drivers]
      summary: List all platform drivers with delivery outcome counters
      responses:
        "200":
          description: Drivers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DriverPlatform"

  /restaurants/{id}/drivers:
    get:
      operationId: listDrivers
      tags: [drivers]
      summary: List drivers for a restaurant
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Drivers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Driver"

    post:
      operationId: createDriver
      tags: [drivers]
      summary: Create driver
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DriverInput"
      responses:
        "201":
          description: Driver created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Driver"

  /drivers/{id}:
    patch:
      operationId: updateDriver
      tags: [drivers]
      summary: Update driver
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DriverPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Driver"

    delete:
      operationId: deleteDriver
      tags: [drivers]
      summary: Delete driver
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "204":
          description: Deleted

  /drivers/{id}/history:
    get:
      operationId: getDriverHistory
      tags: [drivers]
      summary: Get a driver's accepted, rejected, and timed out order attempts
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Driver order attempts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DriverOrderAttempt"

  # ── Orders ──────────────────────────────────────────────────────────────────
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List all orders (admin)
      parameters:
        - name: restaurantId
          in: query
          schema: { type: number }
        - name: status
          in: query
          schema: { type: string }
        - name: driverId
          in: query
          schema: { type: number }
        - name: dateFrom
          in: query
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          schema: { type: string, format: date }
        - name: search
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: number, default: 1 }
        - name: limit
          in: query
          schema: { type: number, default: 20 }
      responses:
        "200":
          description: Orders list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderListResponse"

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get order by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetail"
        "404":
          description: Not found

  /orders/{id}/status:
    patch:
      operationId: updateOrderStatus
      tags: [orders]
      summary: Update order status
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusInput"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetail"

  /orders/{id}/assign-driver:
    post:
      operationId: assignDriver
      tags: [orders]
      summary: Assign driver to order
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DriverAssignment"
      responses:
        "200":
          description: Driver assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetail"

  /orders/{id}/delivery-status:
    get:
      operationId: getOrderDeliveryStatus
      tags: [orders]
      summary: Get WhatsApp delivery status for an order
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Delivery channel attempts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeliveryMessageLog"

  /wp-sender/session:
    get:
      operationId: getWpSenderSessionConfig
      tags: [settings]
      summary: Get WP Sender configuration status without exposing secrets
      responses:
        "200":
          description: Configuration status
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiKeyConfigured: { type: boolean }
                  apiUrlConfigured: { type: boolean }
                  apiUrl: { type: string }
                  sessionId: { type: ["string", "null"] }

  /wp-sender/sessions:
    get:
      operationId: listWpSenderSessions
      tags: [settings]
      summary: List WP Sender WhatsApp sessions
      responses:
        "200": { description: Sessions returned }

  /wp-sender/session/create:
    post:
      operationId: createWpSenderSession
      tags: [settings]
      summary: Create a WP Sender WhatsApp session
      responses:
        "201": { description: Session creation initiated }

  /wp-sender/session/status:
    get:
      operationId: getWpSenderSessionStatus
      tags: [settings]
      summary: Check WP Sender WhatsApp session status
      responses:
        "200": { description: Session status returned }

  /wp-sender/session/details:
    get:
      operationId: getWpSenderSessionDetails
      tags: [settings]
      summary: Get WP Sender WhatsApp session details
      responses:
        "200": { description: Session details returned }

  /wp-sender/session/reconnect:
    post:
      operationId: reconnectWpSenderSession
      tags: [settings]
      summary: Reconnect a WP Sender WhatsApp session
      responses:
        "200": { description: Reconnection requested }

  /wp-sender/session/qr:
    get:
      operationId: getWpSenderSessionQr
      tags: [settings]
      summary: Get the configured WP Sender session QR code
      parameters:
        - name: output
          in: query
          schema: { type: string, enum: [image, base64, raw], default: base64 }
      responses:
        "200": { description: QR code returned }

  /wp-sender/session/pairing-code:
    post:
      operationId: requestWpSenderPairingCode
      tags: [settings]
      summary: Request a WP Sender WhatsApp pairing code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phoneNumber]
              properties:
                phoneNumber: { type: string }
      responses:
        "200": { description: Pairing code returned }

  /wp-sender/session/webhook:
    post:
      operationId: setWpSenderWebhook
      tags: [settings]
      summary: Configure the WP Sender session webhook URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, webhookUrl]
              properties:
                sessionId: { type: string }
                webhookUrl: { type: string }
      responses:
        "200": { description: Webhook configured }

  # ── Public storefront ────────────────────────────────────────────────────────
  /public/restaurants/{slug}:
    get:
      operationId: getPublicRestaurant
      tags: [public]
      summary: Get restaurant by slug (public)
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Public restaurant info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicRestaurant"
        "404":
          description: Not found

  /public/restaurants/{slug}/menu:
    get:
      operationId: getPublicMenu
      tags: [public]
      summary: Get full menu for customer ordering
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Full menu with categories and products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicMenu"

  /public/restaurants/{slug}/orders:
    post:
      operationId: placeOrder
      tags: [public]
      summary: Place a delivery or reservation order (guest checkout)
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Order placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderConfirmation"
        "400":
          description: Restaurant unavailable or invalid data
        "403":
          description: Restaurant subscription expired

  # ── Analytics ────────────────────────────────────────────────────────────────
  /analytics/summary:
    get:
      operationId: getAnalyticsSummary
      tags: [analytics]
      summary: Dashboard KPI summary
      parameters:
        - name: period
          in: query
          schema: { type: string, enum: [today, week, month, year, custom] }
        - name: dateFrom
          in: query
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Summary metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsSummary"

  /analytics/orders-over-time:
    get:
      operationId: getOrdersOverTime
      tags: [analytics]
      summary: Orders count grouped by day
      parameters:
        - name: period
          in: query
          schema: { type: string, enum: [today, week, month, year, custom] }
        - name: dateFrom
          in: query
