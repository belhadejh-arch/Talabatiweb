  # ── Settings ─────────────────────────────────────────────────────────────────
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get platform settings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"

    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Update platform settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ── Auth ────────────────────────────────────────────────────────────────────
    LoginInput:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }

    AuthResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/AdminUser"

    AdminUser:
      type: object
      required: [id, username, role]
      properties:
        id: { type: number }
        username: { type: string }
        email: { type: ["string", "null"] }
        role: { type: string }

    PasswordChangeInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string }
        newPassword: { type: string, minLength: 8 }

    EmailChangeInput:
      type: object
      required: [currentPassword, newEmail]
      properties:
        currentPassword: { type: string }
        newEmail: { type: string, minLength: 3 }

    # ── Restaurant ──────────────────────────────────────────────────────────────
    Restaurant:
      type: object
      required: [id, name, slug, phone, address, status, createdAt]
      properties:
        id: { type: number }
        name: { type: string }
        slug: { type: string }
        phone: { type: string }
        address: { type: string }
        logoUrl: { type: ["string", "null"] }
        coverUrl: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        primaryColor: { type: ["string", "null"] }
        status:
          type: string
          enum: [ACTIVE, INACTIVE, SUSPENDED]
        whatsappNumber: { type: ["string", "null"] }
        deliveryFee: { type: number }
        createdAt: { type: string, format: date-time }
        subscription:
          $ref: "#/components/schemas/Subscription"

    RestaurantInput:
      type: object
      required: [name, slug, phone, address, subscriptionPlan]
      properties:
        name: { type: string, minLength: 1 }
        slug: { type: string, minLength: 1, pattern: "^[a-z0-9-]+$" }
        phone: { type: string }
        address: { type: string }
        logoUrl: { type: string }
        coverUrl: { type: string }
        description: { type: string }
        primaryColor: { type: string }
        whatsappNumber: { type: string }
        deliveryFee: { type: number, minimum: 0 }
        subscriptionPlan:
          type: string
          enum: [TRIAL, MONTHLY, YEARLY]

    RestaurantPatch:
      type: object
      properties:
        name: { type: string }
        phone: { type: string }
        address: { type: string }
        logoUrl: { type: ["string", "null"] }
        coverUrl: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        primaryColor: { type: ["string", "null"] }
        whatsappNumber: { type: ["string", "null"] }
        deliveryFee: { type: number, minimum: 0 }

    StatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ACTIVE, INACTIVE, SUSPENDED]

    RestaurantListResponse:
      type: object
      required: [data, total, page, limit]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Restaurant"
        total: { type: number }
        page: { type: number }
        limit: { type: number }

    # ── Subscription ────────────────────────────────────────────────────────────
    Subscription:
      type: object
      required: [id, restaurantId, plan, status, startDate, expiryDate]
      properties:
        id: { type: number }
        restaurantId: { type: number }
        plan:
          type: string
          enum: [TRIAL, MONTHLY, YEARLY]
        status:
          type: string
          enum: [TRIAL, ACTIVE, EXPIRED, SUSPENDED, INACTIVE]
        startDate: { type: string, format: date }
        expiryDate: { type: string, format: date }
        createdAt: { type: string, format: date-time }

    SubscriptionInput:
      type: object
      required: [plan]
      properties:
        plan:
          type: string
          enum: [TRIAL, MONTHLY, YEARLY]

    SubscriptionPatch:
      type: object
      properties:
        plan:
          type: string
          enum: [TRIAL, MONTHLY, YEARLY]
        status:
          type: string
          enum: [TRIAL, ACTIVE, EXPIRED, SUSPENDED, INACTIVE]
        extensionDays: { type: number }
        renew: { type: boolean }

    SubscriptionListResponse:
      type: object
      required: [data, total, page, limit]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Subscription"
        total: { type: number }
        page: { type: number }
        limit: { type: number }

    # ── Category ────────────────────────────────────────────────────────────────
    Category:
      type: object
      required: [id, restaurantId, name, sortOrder, isAvailable]
      properties:
        id: { type: number }
        restaurantId: { type: number }
        name: { type: string }
        nameAr: { type: ["string", "null"] }
        imageUrl: { type: ["string", "null"] }
        sortOrder: { type: number }
        isAvailable: { type: boolean }

    CategoryInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        nameAr: { type: string }
        imageUrl: { type: string }
        sortOrder: { type: number }
        isAvailable: { type: boolean }

    CategoryPatch:
      type: object
      properties:
        name: { type: string }
        nameAr: { type: ["string", "null"] }
        imageUrl: { type: ["string", "null"] }
        sortOrder: { type: number }
        isAvailable: { type: boolean }

    # ── Product ─────────────────────────────────────────────────────────────────
    Product:
      type: object
      required: [id, restaurantId, categoryId, name, price, isAvailable]
      properties:
        id: { type: number }
        restaurantId: { type: number }
        categoryId: { type: number }
        name: { type: string }
        nameAr: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        descriptionAr: { type: ["string", "null"] }
        imageUrl: { type: ["string", "null"] }
        price: { type: number }
        isAvailable: { type: boolean }
        stockQuantity: { type: ["number", "null"] }
        sortOrder: { type: number }
        addons:
          type: array
          items:
            $ref: "#/components/schemas/Addon"
        sizes:
          type: array
          items:
            $ref: "#/components/schemas/ProductSize"

    ProductInput:
      type: object
      required: [categoryId, name, price]
      properties:
        categoryId: { type: number }
        name: { type: string, minLength: 1 }
        nameAr: { type: string }
        description: { type: string }
        descriptionAr: { type: string }
        imageUrl: { type: string }
        price: { type: number, minimum: 0 }
        isAvailable: { type: boolean }
        stockQuantity: { type: ["number", "null"] }
        sortOrder: { type: number }

    ProductPatch:
      type: object
      properties:
        categoryId: { type: number }
        name: { type: string }
        nameAr: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        descriptionAr: { type: ["string", "null"] }
        imageUrl: { type: ["string", "null"] }
        price: { type: number }
        isAvailable: { type: boolean }
        stockQuantity: { type: ["number", "null"] }
        sortOrder: { type: number }

    # ── Product Size ────────────────────────────────────────────────────────────
    ProductSize:
      type: object
      required: [id, productId, name, price, isAvailable]
      properties:
        id: { type: number }
        productId: { type: number }
        name: { type: string }
        nameAr: { type: ["string", "null"] }
        price: { type: number }
        sortOrder: { type: number }
        isAvailable: { type: boolean }

    ProductSizeInput:
      type: object
      required: [name, price]
      properties:
        name: { type: string, minLength: 1 }
        nameAr: { type: string }
        price: { type: number, minimum: 0 }
        sortOrder: { type: number }
        isAvailable: { type: boolean }

    ProductSizePatch:
      type: object
      properties:
        name: { type: string }
        nameAr: { type: ["string", "null"] }
        price: { type: number }
        sortOrder: { type: number }
        isAvailable: { type: boolean }

    # ── Addon ───────────────────────────────────────────────────────────────────
    Addon:
      type: object
      required: [id, productId, name, price, isAvailable]
      properties:
        id: { type: number }
        productId: { type: number }
        name: { type: string }
        nameAr: { type: ["string", "null"] }
        price: { type: number }
        isAvailable: { type: boolean }

    AddonInput:
      type: object
      required: [name, price]
      properties:
        name: { type: string, minLength: 1 }
        nameAr: { type: string }
        price: { type: number, minimum: 0 }
        isAvailable: { type: boolean }

    AddonPatch:
      type: object
      properties:
        name: { type: string }
        nameAr: { type: ["string", "null"] }
        price: { type: number }
        isAvailable: { type: boolean }

    # ── Driver ──────────────────────────────────────────────────────────────────
    Driver:
      type: object
      required: [id, restaurantId, name, phone, isActive, status, totalDeliveries]
      properties:
        id: { type: number }
        restaurantId: { type: number }
        name: { type: string }
        phone: { type: string }
        whatsappNumber: { type: ["string", "null"] }
        address: { type: ["string", "null"] }
        vehicleType: { type: ["string", "null"] }
        vehiclePlate: { type: ["string", "null"] }
        isActive: { type: boolean }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        totalDeliveries: { type: number }
        createdAt: { type: string, format: date-time }

    DriverInput:
      type: object
      required: [name, phone, whatsappNumber]
      properties:
        name: { type: string, minLength: 1 }
        phone: { type: string }
        whatsappNumber: { type: string, minLength: 1 }
        address: { type: string }
        vehicleType: { type: string }
        vehiclePlate: { type: string }
        isActive: { type: boolean }

    DriverPatch:
      type: object
      properties:
        name: { type: string }
        phone: { type: string }
        whatsappNumber: { type: ["string", "null"] }
        address: { type: ["string", "null"] }
        vehicleType: { type: ["string", "null"] }
        vehiclePlate: { type: ["string", "null"] }
        isActive: { type: boolean }

    DriverPlatform:
      allOf:
        - $ref: "#/components/schemas/Driver"
        - type: object
          required: [restaurantName, acceptedCount, rejectedCount, timeoutCount]
          properties:
            restaurantName: { type: string }
            acceptedCount: { type: number }
            rejectedCount: { type: number }
            timeoutCount: { type: number }

    DriverOrderAttempt:
      type: object
      required: [id, orderId, driverId, status, sentAt, timeoutAt]
      properties:
        id: { type: number }
        orderId: { type: number }
        driverId: { type: number }
        status: { type: string, enum: [PENDING, ACCEPTED, REJECTED, TIMEOUT] }
        sentAt: { type: string, format: date-time }
        responseAt: { type: ["string", "null"], format: date-time }
        timeoutAt: { type: string, format: date-time }
        customerName: { type: string }
        customerPhone: { type: string }
        totalAmount: { type: number }
        orderStatus: { type: string }
        orderCreatedAt: { type: string, format: date-time }

    DriverAssignment:
      type: object
      required: [driverId]
      properties:
        driverId: { type: number }

    DeliveryMessageLog:
      type: object
      required: [id, orderId, driverId, channel, status, sentAt]
      properties:
        id: { type: number }
        orderId: { type: number }
        driverId: { type: number }
        channel: { type: string, enum: [WHATSAPP] }
        status: { type: string, enum: [SENT, FAILED] }
        errorMessage: { type: ["string", "null"] }
        sentAt: { type: string, format: date-time }
        responseAt: { type: ["string", "null"], format: date-time }

    # ── Order ───────────────────────────────────────────────────────────────────
    Order:
      type: object
      required: [id, restaurantId, orderType, customerName, customerPhone, totalAmount, status, createdAt]
      properties:
        id: { type: number }
        restaurantId: { type: number }
        restaurantName: { type: string }
        orderType: { type: string, enum: [DELIVERY, RESERVATION] }
        customerName: { type: string }
        customerPhone: { type: string }
        notes: { type: ["string", "null"] }
        latitude: { type: ["number", "null"] }
        longitude: { type: ["number", "null"] }
        mapsUrl: { type: ["string", "null"] }
        subtotal: { type: number }
        deliveryFee: { type: number }
        totalAmount: { type: number }
        status:
          type: string
          enum: [NEW, ACCEPTED, PREPARING, READY, OUT_FOR_DELIVERY, DELIVERED, CANCELLED]
        driverId: { type: ["number", "null"] }
        driverName: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }

    OrderDetail:
      type: object
      required: [id, restaurantId, orderType, customerName, customerPhone, totalAmount, status, items, statusHistory, createdAt]
      properties:
        id: { type: number }
        restaurantId: { type: number }
        restaurantName: { type: string }
        orderType: { type: string, enum: [DELIVERY, RESERVATION] }
        customerName: { type: string }
        customerPhone: { type: string }
        notes: { type: ["string", "null"] }
        latitude: { type: ["number", "null"] }
        longitude: { type: ["number", "null"] }
        mapsUrl: { type: ["string", "null"] }
        subtotal: { type: number }
        deliveryFee: { type: number }
        totalAmount: { type: number }
        status:
          type: string
          enum: [NEW, ACCEPTED, PREPARING, READY, OUT_FOR_DELIVERY, DELIVERED, CANCELLED]
        driverId: { type: ["number", "null"] }
        driverName: { type: ["string", "null"] }
        driverPhone: { type: ["string", "null"] }
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        statusHistory:
          type: array
          items:
            $ref: "#/components/schemas/StatusHistoryEntry"
        createdAt: { type: string, format: date-time }

    OrderItem:
      type: object
      required: [id, productId, productName, quantity, unitPrice, subtotal]
      properties:
        id: { type: number }
        productId: { type: number }
        productName: { type: string }
        sizeId: { type: ["number", "null"] }
        sizeName: { type: ["string", "null"] }
        quantity: { type: number }
        unitPrice: { type: number }
        subtotal: { type: number }
        selectedAddons:
          type: array
          items:
            $ref: "#/components/schemas/SelectedAddon"

    SelectedAddon:
      type: object
      required: [addonId, addonName, price]
      properties:
        addonId: { type: number }
        addonName: { type: string }
        price: { type: number }

    StatusHistoryEntry:
      type: object
      required: [status, changedAt]
      properties:
        status: { type: string }
        changedAt: { type: string, format: date-time }
        note: { type: ["string", "null"] }

    OrderListResponse:
      type: object
      required: [data, total, page, limit]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        total: { type: number }
        page: { type: number }
        limit: { type: number }

    OrderStatusInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [NEW, ACCEPTED, PREPARING, READY, OUT_FOR_DELIVERY, DELIVERED, CANCELLED]
        note: { type: string }

    OrderConfirmation:
      type: object
      required: [orderId, status]
      properties:
        orderId: { type: number }
        status: { type: string }
        message: { type: string }

    # ── Order Input (public guest checkout) ──────────────────────────────────────
    OrderInput:
      type: object
      required: [customerName, customerPhone, orderType, items]
      properties:
        customerName: { type: string, minLength: 1 }
        customerPhone: { type: string }
        notes: { type: string }
        orderType: { type: string, enum: [DELIVERY, RESERVATION] }
        latitude: { type: ["number", "null"] }
        longitude: { type: ["number", "null"] }
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderItemInput"

    OrderItemInput:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: number }
        quantity: { type: number, minimum: 1 }
        selectedSizeId: { type: ["number", "null"] }
        selectedAddonIds:
          type: array
          items: { type: number }

    # ── Public storefront ────────────────────────────────────────────────────────
    PublicRestaurant:
      type: object
      required: [id, name, slug, address, status]
      properties:
        id: { type: number }
        name: { type: string }
        slug: { type: string }
        address: { type: string }
        logoUrl: { type: ["string", "null"] }
        coverUrl: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        primaryColor: { type: ["string", "null"] }
        status: { type: string }
        isAcceptingOrders: { type: boolean }
        deliveryFee: { type: number }

    PublicMenu:
      type: object
      required: [restaurant, categories]
      properties:
        restaurant:
          $ref: "#/components/schemas/PublicRestaurant"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/PublicCategory"

    PublicCategory:
      type: object
      required: [id, name, products]
      properties:
        id: { type: number }
        name: { type: string }
        nameAr: { type: ["string", "null"] }
        imageUrl: { type: ["string", "null"] }
        products:
          type: array
          items:
            $ref: "#/components/schemas/Product"

    # ── Analytics ────────────────────────────────────────────────────────────────
    AnalyticsSummary:
      type: object
      required: [totalRestaurants, activeRestaurants, trialRestaurants, expiredRestaurants, totalOrders, totalRevenue, averageOrderValue, newOrdersToday]
      properties:
        totalRestaurants: { type: number }
        activeRestaurants: { type: number }
        trialRestaurants: { type: number }
        expiredRestaurants: { type: number }
        suspendedRestaurants: { type: number }
        totalOrders: { type: number }
        totalRevenue: { type: number }
        averageOrderValue: { type: number }
        newOrdersToday: { type: number }
        revenueToday: { type: number }

    TimeSeriesPoint:
      type: object
      required: [date, value]
      properties:
        date: { type: string }
        value: { type: number }

    RestaurantStat:
      type: object
      required: [restaurantId, restaurantName, totalOrders, totalRevenue]
      properties:
        restaurantId: { type: number }
        restaurantName: { type: string }
        totalOrders: { type: number }
        totalRevenue: { type: number }

    ProductStat:
      type: object
      required: [productId, productName, restaurantName, totalSold, totalRevenue]
      properties:
        productId: { type: number }
        productName: { type: string }
        restaurantName: { type: string }
        totalSold: { type: number }
        totalRevenue: { type: number }

    DriverStat:
      type: object
      required: [driverId, driverName, restaurantName, totalDeliveries]
      properties:
        driverId: { type: number }
        driverName: { type: string }
        restaurantName: { type: string }
        totalDeliveries: { type: number }
        deliveredCount: { type: number }

    HourStat:
      type: object
      required: [hour, orderCount]
      properties:
        hour: { type: number }
        orderCount: { type: number }

    # ── Notifications ────────────────────────────────────────────────────────────
    Notification:
      type: object
      required: [id, type, message, isRead, createdAt]
      properties:
        id: { type: number }
        type: { type: string }
        message: { type: string }
        relatedId: { type: ["number", "null"] }
        relatedType: { type: ["string", "null"] }
        isRead: { type: boolean }
        createdAt: { type: string, format: date-time }

    NotificationListResponse:
      type: object
      required: [data, total, unreadCount]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        total: { type: number }
        unreadCount: { type: number }

    # ── Settings ─────────────────────────────────────────────────────────────────
    Settings:
      type: object
      required: [id]
      properties:
        id: { type: number }
        platformName: { type: string }
        whatsappEnabled: { type: boolean }
        defaultCurrency: { type: string }
        mapsApiKey: { type: ["string", "null"] }
        driverResponseTimeoutSeconds: { type: number, minimum: 30, maximum: 86400 }
        updatedAt: { type: string, format: date-time }

    SettingsPatch:
      type: object
      properties:
        platformName: { type: string }
        whatsappEnabled: { type: boolean }
        defaultCurrency: { type: string }
        mapsApiKey: { type: ["string", "null"] }
        driverResponseTimeoutSeconds: { type: number, minimum: 30, maximum: 86400 }
