kind = "web"
previewPath = "/"
title = "TALABAT - منصة إدارة المطاعم"
description = "منصة SaaS متعددة المطاعم تتيح لـ Super Admin إدارة المطاعم والمنيو والطلبات والسائقين والاشتراكات. كل مطعم له رابط خاص لاستقبال طلبات التوصيل من العملاء."
version = "1.0.0"
id = "artifacts/talabat"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24738

[services.development]
run = "pnpm --filter @workspace/talabat run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/talabat", "run", "build" ]
serve = "static"
publicDir = "artifacts/talabat/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24738"
BASE_PATH = "/"
