kind = "web"
previewPath = "/talabat/"
title = "طلبات — واجهة الويب"
description = "واجهة ويب عربية لعرض المطاعم ومنتجاتها وإنشاء الطلبات ومتابعة الإدارة، تتصل بخادم الطلبات الحالي على Render."
version = "1.0.0"
id = "artifacts/talabat"
router = "path"

[[services]]
name = "web"
paths = [ "/talabat/" ]
localPort = 24738

[services.development]
run = "pnpm --filter @workspace/talabat run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/talabat", "run", "build" ]
serve = "static"
publicDir = "dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24738"
BASE_PATH = "/talabat/"